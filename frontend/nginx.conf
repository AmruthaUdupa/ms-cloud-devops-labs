server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    # Serve the file if it exists, otherwise hand the path to index.html so the
    # app's own router can deal with it. Without this, refreshing /notes/<id>
    # makes nginx look for a file of that name and return 404.
    try_files $uri $uri/ /index.html;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
